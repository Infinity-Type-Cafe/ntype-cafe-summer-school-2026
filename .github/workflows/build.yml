name: Build and Deploy

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            maplgebra/ntype-cafe:1.3 \
            sh -lc '
              set -e
              cp -r /source/* /srv/jekyll
              cp /repo/*/intro-page/* /srv/jekyll/_posts/
              cp -r /repo/learn-TT /srv/jekyll
              mkdir -p /srv/jekyll/en
              cp /repo/english.md /srv/jekyll/en/index.md
              cd /srv/jekyll
              jekyll build --future
              find _site -type f \( -name "*.html" -o -name "*.xml" -o -name "*.css" -o -name "*.js" \) -exec sed -i "s#/ntype-cafe-summer-school/#/ntype-cafe-summer-school-2026/#g" {} +
              mkdir -p _site/assets
              cp /repo/language-switcher.js _site/assets/language-switcher.js
              cp /repo/language-switcher.css _site/assets/language-switcher.css
              find _site -type f -name "*.html" -exec sed -i "s#</head>#<link rel=\"alternate\" hreflang=\"zh-CN\" href=\"https://infinity-type-cafe.github.io/ntype-cafe-summer-school-2026/\"><link rel=\"alternate\" hreflang=\"en\" href=\"https://infinity-type-cafe.github.io/ntype-cafe-summer-school-2026/en/\"><link rel=\"stylesheet\" href=\"/ntype-cafe-summer-school-2026/assets/language-switcher.css\"><script defer src=\"/ntype-cafe-summer-school-2026/assets/language-switcher.js\"></script></head>#" {} +
              test -f _site/en/index.html
              test -f _site/assets/language-switcher.js
              test -f _site/assets/language-switcher.css
              for marker in language-switcher.css language-switcher.js; do
                if find _site -type f -name "*.html" -exec grep -L "$marker" {} + | grep -q .; then
                  echo "Missing $marker injection in one or more HTML files." >&2
                  exit 1
                fi
              done
              mkdir -p /repo/_build_site
              cp -r _site/* /repo/_build_site/
              cp -r /repo/resources/agda-zorn /repo/_build_site/
              cp -r /repo/resources/synthetic-incompleteness /repo/_build_site/
            '

      - name: Deploy
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _build_site
