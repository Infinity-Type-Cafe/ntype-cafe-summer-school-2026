name: Build and Deploy

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            maplgebra/ntype-cafe:1.3 \
            sh -lc '
              set -e
              cp -r /source/* /srv/jekyll
              cp /repo/*/intro-page/* /srv/jekyll/_posts/
              cp -r /repo/learn-TT /srv/jekyll
              cd /srv/jekyll
              jekyll build
              mkdir -p /repo/_build_site
              cp -r _site/* /repo/_build_site/
              cp -r /repo/resources/agda-zorn /repo/_build_site/
              cp -r /repo/resources/synthetic-incompleteness /repo/_build_site/
            '

      - name: Deploy
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _build_site
