name: One-time copy of previous summer school site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy source files except workflow definitions
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/Infinity-Type-Cafe/ntype-cafe-summer-school.git "$RUNNER_TEMP/source"
          rsync -a --delete --exclude ".git/" --exclude ".github/workflows/" "$RUNNER_TEMP/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Copy previous summer school site"
          git push origin main
